version: "3.9"

services:
  # ─── PostgreSQL Primary ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: noryvanta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: noryvanta
      POSTGRES_PASSWORD: ${DB_PASSWORD:-noryvanta_dev}
      POSTGRES_DB: noryvanta
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noryvanta -d noryvanta"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noryvanta_net

  # ─── Redis (Broker + Cache) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: noryvanta_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noryvanta_net

  # ─── FastAPI Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noryvanta_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://noryvanta:${DB_PASSWORD:-noryvanta_dev}@db:5432/noryvanta
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/1
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - noryvanta_net

  # ─── Celery Worker ────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noryvanta_celery
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://noryvanta:${DB_PASSWORD:-noryvanta_dev}@db:5432/noryvanta
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/1
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 -Q default,escrow,kyc,notifications
    depends_on:
      - backend
    networks:
      - noryvanta_net

  # ─── Celery Beat (Scheduler) ──────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noryvanta_beat
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://noryvanta:${DB_PASSWORD:-noryvanta_dev}@db:5432/noryvanta
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/1
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.celery_app beat --loglevel=info
    depends_on:
      - celery_worker
    networks:
      - noryvanta_net

  # ─── Flower (Celery monitoring) ───────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: noryvanta_flower
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379/1
      FLOWER_BASIC_AUTH: admin:${FLOWER_PASSWORD:-flower_dev}
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - noryvanta_net

  # ─── Next.js Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noryvanta_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-nextauth_dev_secret}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - noryvanta_net

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: noryvanta_nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - noryvanta_net

  # ─── Prometheus ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: noryvanta_prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    networks:
      - noryvanta_net

  # ─── Grafana ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: noryvanta_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-grafana_dev}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - noryvanta_net

  # ─── OpenSearch (Logs) ────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: noryvanta_opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      plugins.security.disabled: "true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - noryvanta_net

  # ─── OpenSearch Dashboards ────────────────────────────────────────
  opensearch_dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: noryvanta_osd
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch
    networks:
      - noryvanta_net

volumes:
  pg_data:
  redis_data:
  prometheus_data:
  grafana_data:
  opensearch_data:

networks:
  noryvanta_net:
    driver: bridge

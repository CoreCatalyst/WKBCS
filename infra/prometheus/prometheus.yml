global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "noryvanta_prod"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # FastAPI Backend metrics via prometheus-fastapi-instrumentator
  - job_name: "noryvanta_backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  # Celery Worker metrics
  - job_name: "celery_worker"
    static_configs:
      - targets: ["celery_worker:9540"]
    scrape_interval: 15s

  # PostgreSQL Exporter
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  # Redis Exporter
  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]

  # Node Exporter (System metrics)
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  # Nginx Exporter
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx_exporter:9113"]

apiVersion: 1

providers:
  - name: "Noryvanta Dashboards"
    orgId: 1
    folder: "Noryvanta"
    folderUid: "noryvanta"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
